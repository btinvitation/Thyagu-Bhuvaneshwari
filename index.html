<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bhuvaneshwari ❤️ Thyagu Reception</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

</head>

<body>

<!-- Background -->

<div class="background"></div>

  <!-- ===========================
Luxury Envelope
============================ -->

<div id="envelope-screen">

    <div class="envelope">

        <div class="envelope-back"></div>

        <div class="letter">

            <img src="assets/images/invitation-card.jpg.JPG"
                 alt="Invitation">

            <button id="openLetter">
                Open Invitation
            </button>

        </div>

        <div class="envelope-flap"></div>

    </div>

</div>
<!-- Hero Section -->

<section class="hero">

<div class="overlay"></div>

<div class="hero-content">

<h3 class="welcome">
Together With Their Families
</h3>

<h1 class="names">
Bhuvaneshwari
<span>&</span>
Thyagu
</h1>

<p class="invite">
Request the pleasure of your gracious presence
at their Reception Ceremony
</p>

<button id="openInvitation">
Open Invitation
</button>

<div class="scroll-indicator">

<span>Scroll Down to View More</span>

<div class="mouse">

<div class="wheel"></div>

</div>

</div>

</div>

</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script src="script.js"></script>

</body>

</html>
